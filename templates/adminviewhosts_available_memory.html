{% extends 'adminheader.html'  %}
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
</head>
<body>

  {% block content %}
<script type="text/javascript">
setTimeout(function() {
  window.location.reload();
}, 10000); // Reloads after 1 minute (60000 milliseconds)  
</script>

    <script src="../static/assets/js/canvasjs.min.js"></script>    

  <main class="main">
<!-- Page Title -->
    <div class="page-title light-background">
      <div class="container d-lg-flex justify-content-between align-items-center">
        <h1 class="mb-2 mb-lg-0">Admin View Hosts</h1>
        <nav class="breadcrumbs">
          <ol>
            <li><a href="/adminmainpage">Home</a></li>
            <li class="current">Admin View Hosts</li>
          </ol>
        </nav>
      </div>
    </div><!-- End Page Title -->
    <!-- Contact Section -->
    <section id="contact" class="contact section">

      <div class="container" data-aos="fade-up" data-aos-delay="100">


        <div class="row gy-4">

          <div class="col-lg-8">
            <form action="/adminviewhosts" method="post" data-aos="fade-up" data-aos-delay="200">
              <div class="row gy-4">
                
                <div class="col-md-12">
                {% for x in allhosts %}
                  <button type="submit" name="choice" value="{{x}}">{{x}}</button>
                  &nbsp;&nbsp;&nbsp;&nbsp;
                {% endfor %}
                </div>
                
              </div>
            </form>
          </div><!-- End Contact Form -->

        </div>
        <div class="row gy-4 mt-1">

          <div class="col-lg-8">
            <form action="/adminviewhosts1" method="post" data-aos="fade-up" data-aos-delay="200">
              <div class="row gy-4">
                
                <div class="col-md-12">
                  <button type="submit" name="choice1" value="availablememory">Available Memory</button>
                  &nbsp;&nbsp;&nbsp;&nbsp;
                  <button type="submit" name="choice1" value="cpuusage">CPU Usage</button>
                  &nbsp;&nbsp;&nbsp;&nbsp;
                  <button type="submit" name="choice1" value="memoryusage">Memory Usage</button>
                  &nbsp;&nbsp;&nbsp;&nbsp;
                  <button type="submit" name="choice1" value="bytessent_received">Bytes Sent/Received</button>
                  &nbsp;&nbsp;&nbsp;&nbsp;
                </div>
              </div>
            </form>
          </div><!-- End Contact Form -->
{% if graph_data %}

          <script>
  window.onload = function () {
  var chart= new CanvasJS.Chart("chartContainer", {
    theme: "light2",
    title: {
      text: "Available Memory in %"
    },
    axisY: {
      title: "Available Memory",
      stripLines: [{
        value: 100,
        label: "%"
      }]
    },
    data: [{
      type: "line",
      yValueFormatString: "#,##0.0#'%'",
      dataPoints: {{ graph_data|safe }}
    }]
  });
  chart.render();
}
</script>
          <div id="chartContainer" style="width: 100%; height: 360px;"></div>
{% endif %}
        </div>

      </div>

    </section><!-- /Contact Section -->

      </main>
{% endblock %}
</body>

</html>
